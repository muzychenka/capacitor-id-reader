name: Build
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p /tmp/mrz-tests && javac -d /tmp/mrz-tests android/src/main/java/dev/idreader/capacitor/MrzLines.java test/android/dev/idreader/capacitor/MrzLinesTest.java && java -cp /tmp/mrz-tests dev.idreader.capacitor.MrzLinesTest
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle -p android-test :idreader:assembleDebug
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme CapacitorIdReader -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
